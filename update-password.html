<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update password — Reign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-art">
    <a href="userdash.html" class="crest" style="color:#fff;"><span class="mark"></span><span class="name">Reign</span></a>
    <div>
      <h2 style="color:#fff;font-size:32px;max-width:380px;">Keep your account secure.</h2>
      <p style="color:rgba(255,255,255,.65);max-width:360px;line-height:1.6;">You'll need your current password to confirm this change.</p>
    </div>
    <div></div>
  </div>
  <div class="auth-form">
    <div class="box">
      <div class="eyebrow" style="margin-bottom:18px;">Account security</div>
      <h1 style="font-size:28px;">Update password</h1>
      <p style="color:var(--muted);margin-bottom:26px;font-size:14.5px;"><a href="userdash.html" style="color:var(--gold-dim);font-weight:600;">&larr; Back to dashboard</a></p>
      <form id="updForm">
        <div class="field"><label>Current password</label><input type="password" id="current" required></div>
        <div class="field"><label>New password</label><input type="password" id="next" required minlength="6"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="confirm" required minlength="6"></div>
        <button type="submit" class="btn btn-navy btn-block">Update password</button>
      </form>
      <p id="err" style="color:var(--coral);font-size:13.5px;margin-top:14px;display:none;"></p>
      <p id="ok" style="color:var(--emerald);font-size:13.5px;margin-top:14px;display:none;">Password updated successfully.</p>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script>
  const user = requireAuth();
  if(user){
    document.getElementById('updForm').addEventListener('submit', e=>{
      e.preventDefault();
      const err = document.getElementById('err'), ok = document.getElementById('ok');
      err.style.display='none'; ok.style.display='none';
      const next = document.getElementById('next').value, confirm = document.getElementById('confirm').value;
      if(next !== confirm){ err.textContent='New passwords do not match.'; err.style.display='block'; return; }
      try{
        DB.updatePassword(user, document.getElementById('current').value, next);
        ok.style.display='block';
        document.getElementById('updForm').reset();
      }catch(ex){ err.textContent = ex.message; err.style.display='block'; }
    });
  }
</script>
</body>
</html>
