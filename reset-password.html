<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — Reign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-art">
    <a href="index.html" class="crest" style="color:#fff;"><span class="mark"></span><span class="name">Reign</span></a>
    <div>
      <h2 style="color:#fff;font-size:32px;max-width:380px;">Choose a strong new password.</h2>
      <p style="color:rgba(255,255,255,.65);max-width:360px;line-height:1.6;">Use at least 6 characters, mixing letters and numbers for the best protection.</p>
    </div>
    <div></div>
  </div>
  <div class="auth-form">
    <div class="box" id="formBox">
      <div class="eyebrow" style="margin-bottom:18px;">New password</div>
      <h1 style="font-size:28px;">Set a new password</h1>
      <p style="color:var(--muted);margin-bottom:26px;font-size:14.5px;">Resetting for <b id="forEmail" style="color:var(--ink);"></b></p>
      <form id="resetForm">
        <div class="field"><label>New password</label><input type="password" id="password" required minlength="6"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="confirm" required minlength="6"></div>
        <button type="submit" class="btn btn-navy btn-block">Update password</button>
      </form>
      <p id="err" style="color:var(--coral);font-size:13.5px;margin-top:14px;display:none;"></p>
    </div>
    <div class="box" id="doneBox" style="display:none;text-align:center;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--emerald-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--emerald);font-size:26px;">✓</div>
      <h1 style="font-size:24px;">Password updated</h1>
      <p style="color:var(--muted);margin-bottom:24px;">Your password has been reset. You can now log in with your new credentials.</p>
      <a href="login.html" class="btn btn-gold btn-block">Go to login</a>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';
  document.getElementById('forEmail').textContent = email || '—';
  if(!email || !DB.findByEmail(email)){
    document.getElementById('formBox').innerHTML = '<div class="eyebrow" style="margin-bottom:18px;">Invalid link</div><h1 style="font-size:26px;">This reset link is invalid</h1><p style="color:var(--muted);margin:14px 0 24px;">Request a fresh reset link to continue.</p><a href="forgot-password.html" class="btn btn-navy btn-block">Request new link</a>';
  } else {
    document.getElementById('resetForm').addEventListener('submit', e=>{
      e.preventDefault();
      const err = document.getElementById('err');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if(password !== confirm){ err.textContent='Passwords do not match.'; err.style.display='block'; return; }
      DB.resetPassword(email, password);
      document.getElementById('formBox').style.display='none';
      document.getElementById('doneBox').style.display='block';
    });
  }
</script>
</body>
</html>
